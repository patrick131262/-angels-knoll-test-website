<style>
  /* Layout: a drawing set. Left sheet index, title block, then one "sheet" of square tiles
     with wires drawn between connected tiles. Clicking a tile opens the next, smaller sheet. */
  :root{
    --paper:#ECEAE0; --paper-2:#E2DFD1; --ink:#1F2421; --ink-soft:#4B5049; --line:#C9C4B4;
    --political:#3457A6; --financial:#B8792F; --cultural:#3F6B4F; --flag:#A33B2B;
    --history:#6B6558; --record:#1F2421;
    --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
    --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B1D18; --paper-2:#23261F; --ink:#E9E6DA; --ink-soft:#B8B6A8; --line:#3A3D33;
      --political:#7896D1; --financial:#D9A05B; --cultural:#7CAE8C; --flag:#D68271;
      --history:#A89F8C; --record:#E9E6DA; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1D18; --paper-2:#23261F; --ink:#E9E6DA; --ink-soft:#B8B6A8; --line:#3A3D33;
    --political:#7896D1; --financial:#D9A05B; --cultural:#7CAE8C; --flag:#D68271;
    --history:#A89F8C; --record:#E9E6DA; color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{min-height:100%;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;}
  h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;}
  p{line-height:1.55;margin:0 0 1em 0;max-width:66ch;}
  button{font-family:var(--sans);color:inherit;}
  a{color:var(--political);}

  .frame{display:flex;min-height:calc(100vh - 20px);border:1px solid var(--line);margin:10px;}
  @media (max-width:760px){.frame{flex-direction:column;margin:6px;}}

  /* sheet index */
  .spine{width:212px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;}
  @media (max-width:760px){.spine{width:auto;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);}}
  .spine-head{padding:18px 16px 14px;border-bottom:1px solid var(--line);}
  @media (max-width:760px){.spine-head{display:none;}}
  .mark{font-size:11px;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase;}
  .spine-head h1{font-size:18px;line-height:1.25;margin-top:4px;}
  .sheet-btn{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;background:none;border:none;
    border-bottom:1px solid var(--line);padding:13px 16px;cursor:pointer;color:var(--ink-soft);}
  @media (max-width:760px){.sheet-btn{border-bottom:none;border-right:1px solid var(--line);white-space:nowrap;width:auto;}}
  .sheet-btn .num{font-variant-numeric:tabular-nums;font-size:12px;}
  .sheet-btn .name{font-size:13.5px;font-weight:500;}
  .sheet-btn .sw{width:8px;height:8px;border-radius:50%;flex-shrink:0;align-self:center;}
  .sheet-btn[aria-current="true"]{background:var(--paper-2);color:var(--ink);}
  .sheet-btn:focus-visible{outline:2px solid var(--political);outline-offset:-2px;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .titleblock{display:flex;justify-content:space-between;align-items:flex-end;padding:16px 28px;
    border-bottom:1px solid var(--line);gap:16px;flex-wrap:wrap;}
  .titleblock .sheetname{font-family:var(--serif);font-size:22px;margin-top:2px;}
  .titleblock .sheetno{font-size:12px;color:var(--ink-soft);text-align:right;font-variant-numeric:tabular-nums;}
  .content{padding:22px 28px 56px;min-width:0;}
  @media (max-width:760px){.titleblock,.content{padding-left:16px;padding-right:16px;}}

  .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}
  .crumbs button{background:none;border:none;color:var(--political);cursor:pointer;padding:2px 0;font-size:12.5px;}
  .crumbs button:hover{text-decoration:underline;}
  .crumbs .cur{color:var(--ink);font-weight:600;}
  .crumbs .up{margin-left:auto;border:1px solid var(--line);padding:4px 10px;color:var(--ink-soft);}
  .intro{font-size:15px;color:var(--ink-soft);margin-bottom:20px;}
  .intro.lede{font-family:var(--serif);font-size:21px;color:var(--ink);max-width:36ch;}

  /* the sheet: tiles + off-sheet rail + wires */
  .map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:34px;align-items:start;}
  .map.root{grid-template-columns:minmax(0,1fr);}
  @media (max-width:900px){.map{grid-template-columns:minmax(0,1fr);}}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:30px;position:relative;z-index:1;}
  @media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;}}
  .tiles.zoom{animation:zoomin .32s ease-out;}
  @keyframes zoomin{from{opacity:.35;transform:scale(.96);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.tiles.zoom{animation:none;}}

  .tile{position:relative;aspect-ratio:1/1;min-width:0;display:flex;flex-direction:column;gap:6px;text-align:left;
    background:var(--paper);border:1px solid var(--line);padding:14px 15px;cursor:pointer;transition:border-color .15s,background .15s;}
  .tile:hover{background:var(--paper-2);}
  .tile:focus-visible{outline:2px solid var(--political);outline-offset:2px;}
  .tile .bar{height:4px;width:34px;flex-shrink:0;}
  .tile .no{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:8px;}
  .tile .t{font-family:var(--serif);font-size:17px;line-height:1.2;font-weight:600;}
  .tile.d0 .t{font-size:20px;}
  .tile .q{font-size:12.5px;color:var(--ink-soft);line-height:1.4;}
  .tile .foot{margin-top:auto;font-size:11.5px;color:var(--ink-soft);}
  .tile ul{margin:2px 0 0;padding:0;list-style:none;font-size:12px;color:var(--ink-soft);}
  .tile li{padding:3px 0;border-top:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tile .open{position:absolute;right:12px;bottom:10px;font-size:12px;color:var(--ink-soft);}
  .tile.leaf .t{font-size:15.5px;}
  .tile.leaf .q{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
  .tile.linked{border-color:var(--ink-soft);}
  .tile.hot{border-color:var(--ink);}
  .tile[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--paper-2);}
  .tile.pending{border-style:dashed;}

  .rail{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px;}
  .rail .mark{margin-bottom:2px;}
  .rail .none{font-size:12px;color:var(--ink-soft);font-style:italic;}
  .port{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--paper);
    border:1px solid var(--line);padding:9px 10px 9px 0;cursor:pointer;}
  .port:hover,.port.hot{border-color:var(--ink);}
  .port:focus-visible{outline:2px solid var(--political);outline-offset:2px;}
  .port .sw{align-self:stretch;}
  .port .pn{font-size:11px;color:var(--ink-soft);display:block;font-variant-numeric:tabular-nums;}
  .port .pt{font-size:13px;font-weight:500;}
  .port .w{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}

  svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible;}
  .wire{fill:none;stroke:var(--ink-soft);opacity:.42;transition:opacity .15s;}
  .wire.hot{opacity:1;}
  .wires.focus .wire:not(.hot){opacity:.07;}
  .wire-end{stroke:none;}
  .wlabel{font-family:var(--sans);font-size:10.5px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;}
  .wires.focus .wlabel:not(.hot){opacity:.1;}

  /* status chips */
  .chip{display:inline-block;font-size:10.5px;letter-spacing:.02em;padding:2px 7px;border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap;}
  .chip[data-s="verified"]{color:var(--ink);border-color:var(--ink-soft);}
  .chip[data-s="secondary"]{border-style:dotted;border-color:var(--ink-soft);}
  .chip[data-s="estimated"]{color:var(--financial);border-color:var(--financial);}
  .chip[data-s="unresolved"],.chip[data-s="nolink"]{color:var(--flag);border-color:var(--flag);}
  .chip[data-s="pending"]{border-style:dashed;font-style:italic;}
  /* legal status: what a court or agency actually decided */
  .chip.lg{font-weight:600;background:var(--paper-2);}
  .chip.lg[data-lg="conviction"],.chip.lg[data-lg="judgment"]{color:var(--paper);background:var(--ink);border-color:var(--ink);}
  .chip.lg[data-lg="pending"]{color:var(--flag);border:1px dashed var(--flag);background:none;}
  .chip.lg[data-lg="press"]{border-style:dotted;}
  .tile .foot{display:flex;flex-wrap:wrap;gap:4px;}
  .foot-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}

  /* notes panel */
  .notes{margin-top:40px;border-top:1px solid var(--line);padding-top:22px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:34px;}
  @media (max-width:760px){.notes{grid-template-columns:minmax(0,1fr);}}
  .notes h2{font-size:21px;margin:4px 0 6px;}
  .notes .role{font-size:13px;color:var(--ink-soft);margin-bottom:12px;}
  .notes .body{font-size:14px;}
  .notes h3{font-family:var(--sans);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin:0 0 8px;}
  .srcs{list-style:none;margin:0 0 20px;padding:0;}
  .srcs li{padding:6px 0;border-top:1px solid var(--line);font-size:13px;}
  .srcs li:first-child{border-top:none;}
  .srcs a::after{content:" ↗";font-size:11px;}
  .conns{display:flex;flex-direction:column;gap:6px;}
  .conn{display:grid;grid-template-columns:8px auto 1fr;gap:10px;align-items:center;text-align:left;background:none;border:1px solid var(--line);padding:7px 10px;cursor:pointer;font-size:13px;}
  .conn:hover{border-color:var(--ink);}
  .conn .sw{width:8px;height:8px;border-radius:50%;}
  .conn .cn{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .legend{display:grid;gap:8px;font-size:12.5px;color:var(--ink-soft);}
  .legend div{display:flex;gap:10px;align-items:center;}
  .legend svg{flex-shrink:0;}
  .empty{font-size:13px;color:var(--ink-soft);font-style:italic;}
</style>

</head>

const STATUS = { verified:"Primary source", located:"Official doc, summary reported", secondary:"Reported", estimated:"Estimate", unresolved:"Unresolved", nolink:"Source not linked", pending:"Research in progress" };

/* ---------- index the tree ---------- */
const N = {};
(function index(list, parent, depth){
  list.forEach((n,i)=>{
    N[n.id] = n; n.parent = parent; n.depth = depth;
    n.cat = n.cat || N[parent].cat;
    if(depth===0) n.no = `A${i+1}.00`;
    else if(depth===1) n.no = `${N[parent].no.split('.')[0]}.${i+1}0`;
    else n.no = `${N[parent].no.slice(0,-1)}${i+1}`;
    if(n.kids) index(n.kids, n.id, depth+1);
  });
})(TREE, null, 0);

const EDGES = []; const seen = new Set();
Object.values(N).forEach(n=>(n.ln||[]).forEach(m=>{
  if(!N[m]){ console.warn("Unknown link", n.id, "→", m); return; }
  const k = [n.id,m].sort().join("|");
  if(n.id!==m && !seen.has(k)){ seen.add(k); EDGES.push([n.id,m]); }
}));

const pathOf = id => { const p=[]; for(let x=id; x; x=N[x].parent) p.unshift(x); return p; };
const leaves = n => n.kids ? n.kids.reduce((a,k)=>a+leaves(k),0) : 1;
const neighbors = id => EDGES.filter(e=>e.includes(id)).map(e=>e[0]===id?e[1]:e[0]);
const color = cat => `var(--${cat})`;
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Map any item to what represents it on the current sheet:
   a visible tile (inside the focus), or a port (the nearest sheet outside it). */
function rep(id, focus){
  const fp = focus ? pathOf(focus) : [];
  const xp = pathOf(id);
  const inside = fp.every((f,i)=>xp[i]===f);
  if(inside){ return xp.length>fp.length ? {id:xp[fp.length], port:false} : null; }
  let c=0; while(xp[c]===fp[c]) c++;
  return {id:xp[c], port:true};
}

/* ---------- state ---------- */
let focus = null, selected = null, hot = null;

function go(f, sel=null, animate=true){
  focus = f; selected = sel; hot = null;
  try{ history.replaceState(null, "", "#" + (sel || f || "map")); }catch(e){}
  render(animate);
}

/* ---------- render ---------- */
function render(animate){
  const node = focus ? N[focus] : null;
  const top = focus ? pathOf(focus)[0] : null;

  // spine
  document.getElementById("spine").innerHTML =
    `<button class="sheet-btn" data-go="" aria-current="${!focus}"><span class="num">A0.00</span><span class="name">Site Map</span></button>` +
    TREE.map(t=>`<button class="sheet-btn" data-go="${t.id}" aria-current="${top===t.id}">
      <span class="sw" style="background:${color(t.cat)}"></span><span class="num">${t.no}</span><span class="name">${esc(t.t)}</span></button>`).join("");

  // title block
  const shown = selected ? N[selected] : node;
  document.getElementById("sheetname").textContent = shown ? shown.t : "Site Map";
  document.getElementById("sheetno").textContent = shown ? shown.no : "A0.00";

  // crumbs
  const cr = document.getElementById("crumbs");
  const p = focus ? pathOf(focus) : [];
  cr.innerHTML = `<button data-go="">Site Map</button>` +
    p.map((id,i)=> `<span aria-hidden="true">/</span>` + (i===p.length-1 ? `<span class="cur">${esc(N[id].t)}</span>` : `<button data-go="${id}">${esc(N[id].t)}</button>`)).join("") +
    (focus ? `<button class="up" data-go="${N[focus].parent||""}">↑ Up one sheet</button>` : "");

  // intro
  const intro = document.getElementById("intro");
  intro.className = "intro" + (focus ? "" : " lede");
  intro.textContent = focus ? node.q : "No single actor controls this site. Six topics, each a sheet you can open. Lines show where a person, document or event in one topic connects to another.";

  // tiles
  const kids = focus ? node.kids : TREE;
  const tiles = document.getElementById("tiles");
  tiles.innerHTML = kids.map(k=>tileHTML(k)).join("");
  if(animate){ tiles.classList.remove("zoom"); void tiles.offsetWidth; tiles.classList.add("zoom"); }

  // edges for this sheet
  const agg = new Map();
  EDGES.forEach(([a,b])=>{
    const ra = rep(a,focus), rb = rep(b,focus);
    if(!ra || !rb || ra.id===rb.id || (ra.port && rb.port)) return;
    const [x,y] = ra.port ? [rb,ra] : [ra,rb];      // tile first
    const key = x.id + "|" + y.id + (y.port?"|p":"");
    const e = agg.get(key) || {a:x.id, b:y.id, port:y.port, w:0, items:new Set()};
    e.w++; e.items.add(a); e.items.add(b);
    agg.set(key, e);
  });
  sheetEdges = [...agg.values()];

  // rail of off-sheet connections
  const ports = {};
  sheetEdges.filter(e=>e.port).forEach(e=>{ ports[e.b] = (ports[e.b]||0) + e.w; });
  const rail = document.getElementById("rail");
  const portIds = Object.keys(ports).sort((a,b)=>ports[b]-ports[a]);
  rail.hidden = !focus;
  document.getElementById("map").classList.toggle("root", !focus);
  rail.innerHTML = `<div class="mark">Links off this sheet</div>` + (portIds.length ? portIds.map(id=>{
      const n = N[id];
      return `<button class="port" data-id="${id}" data-go="${n.kids ? id : n.parent}" ${n.kids?"":`data-sel="${id}"`}>
        <span class="sw" style="background:${color(n.cat)}"></span>
        <span><span class="pn">${n.no}</span><span class="pt">${esc(n.t)}</span></span>
        <span class="w">${ports[id]}</span></button>`;
    }).join("") : `<div class="none">Nothing on this sheet links elsewhere.</div>`);

  renderNotes();
  wire();
  requestAnimationFrame(draw);
}

function tileHTML(n){
  const chip = n.s ? `<span class="chip" data-s="${n.s}">${STATUS[n.s]}</span>` : "";
  const conns = n.kids ? "" : neighbors(n.id).length;
  if(n.depth===0) return `<button class="tile d0" data-id="${n.id}" data-go="${n.id}">
      <span class="bar" style="background:${color(n.cat)}"></span>
      <span class="no"><span>${n.no}</span></span>
      <span class="t">${esc(n.t)}</span><span class="q">${esc(n.q)}</span>
      <span class="foot">${n.kids.length} groups · ${leaves(n)} items</span><span class="open" aria-hidden="true">Open →</span></button>`;
  if(n.kids){
    const names = n.kids.slice(0,3).map(k=>`<li>${esc(k.t)}</li>`).join("") + (n.kids.length>3 ? `<li>+ ${n.kids.length-3} more</li>` : "");
    return `<button class="tile d1" data-id="${n.id}" data-go="${n.id}">
      <span class="bar" style="background:${color(n.cat)}"></span>
      <span class="no"><span>${n.no}</span><span>${n.kids.length} items</span></span>
      <span class="t">${esc(n.t)}</span><ul>${names}</ul><span class="open" aria-hidden="true">Open →</span></button>`;
  }
  return `<button class="tile leaf ${n.s==="pending"?"pending":""}" data-id="${n.id}" data-sel="${n.id}" aria-pressed="${selected===n.id}">
      <span class="bar" style="background:${color(n.cat)}"></span>
      <span class="no"><span>${n.no}</span><span>${conns ? conns + (conns===1?" link":" links") : ""}</span></span>
      <span class="t">${esc(n.t)}</span><span class="q">${esc(n.r)}</span>
      <span class="foot">${lgChip(n)}${chip}</span></button>`;
}
function lgChip(n){
  if(!n.lg) return "";
  const k = n.lg.split(/[ ·(]/)[0].toLowerCase();
  return `<span class="chip lg" data-lg="${k}">${esc(n.lg)}</span>`;
}

function renderNotes(){
  const el = document.getElementById("notes");
  const legend = `<div><h3>How to read this sheet</h3><div class="legend">
      <div><svg width="34" height="10"><path d="M2 5 H32" stroke="currentColor" stroke-width="1.5"/><circle cx="2" cy="5" r="2.5" fill="currentColor"/><circle cx="32" cy="5" r="2.5" fill="currentColor"/></svg>A shared person, document or event. Thicker lines carry more links.</div>
      <div><svg width="34" height="10"><path d="M2 5 H32" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/></svg>A link to a tile on another sheet, listed at the right.</div>
      <div>Hover or focus a tile to isolate its lines. Press Esc to go up a sheet.</div>
      <div>Source strength:</div>
      ${Object.entries(STATUS).map(([k,v])=>`<div><span class="chip" data-s="${k}">${v}</span></div>`).join("")}
      <div>Legal status, where a case is involved: <span class="chip lg" data-lg="conviction">Conviction</span> <span class="chip lg" data-lg="settlement">Settlement</span> <span class="chip lg" data-lg="pending">Pending allegation · not proven</span></div>
    </div></div>`;

  if(!selected){
    const n = focus ? N[focus] : null;
    const count = n ? leaves(n) : Object.values(N).filter(x=>!x.kids).length;
    const pend = Object.values(N).filter(x=>!x.kids && x.s==="pending" && (!n || pathOf(x.id).includes(n.id))).length;
    el.innerHTML = `<div><div class="mark">${n ? n.no : "A0.00"} · Sheet notes</div>
      <h2>${n ? esc(n.t) : "Angels Knoll, Bunker Hill Parcel Y-1"}</h2>
      <p class="body">${n ? esc(n.q) : "A 2.4-acre, ~90-foot slope at 4th and Hill, the last undeveloped piece of the Bunker Hill redevelopment. Open any topic to see its groups, then open a group to see the people, documents and events inside it."}</p>
      <p class="empty">${count} items on this sheet${pend ? `, ${pend} still being researched` : ""}. Select an item to see its sources and connections.</p></div>` + legend;
    return;
  }
  const n = N[selected];
  const srcs = n.src.length ? `<ul class="srcs">${n.src.map(k=>`<li><a href="${U[k][1]}" target="_blank" rel="noopener">${esc(U[k][0])}</a></li>`).join("")}</ul>` : `<p class="empty">${n.s==="pending" ? "No sources shown until verified." : "No source linked yet."}</p>`;
  const nb = neighbors(n.id);
  const conns = nb.length ? `<div class="conns">${nb.map(id=>{ const m=N[id]; return `<button class="conn" data-go="${m.parent}" data-sel="${id}">
      <span class="sw" style="background:${color(m.cat)}"></span><span class="cn">${m.no}</span><span>${esc(m.t)}</span></button>`; }).join("")}</div>` : `<p class="empty">No connections recorded.</p>`;
  const trail = pathOf(n.id).slice(0,-1).map(id=>N[id].t).join(" / ");
  el.innerHTML = `<div><div class="mark">${n.no} · ${esc(trail)}</div>
      <h2>${esc(n.t)}</h2><div class="role">${esc(n.r)}</div><div class="foot-row">${lgChip(n)}<span class="chip" data-s="${n.s}">${STATUS[n.s]}</span></div>
      <p class="body">${esc(n.d)}</p></div>
    <div><h3>Sources</h3>${srcs}<h3>Connected to</h3>${conns}</div>`;
}

/* ---------- wires ---------- */
let sheetEdges = [];
function center(r, m){ return {x:r.left - m.left + r.width/2, y:r.top - m.top + r.height/2, hw:r.width/2, hh:r.height/2}; }
function edgePoint(c, dx, dy){          // where the line from c toward (dx,dy) leaves the box
  const t = Math.min(dx ? c.hw/Math.abs(dx) : Infinity, dy ? c.hh/Math.abs(dy) : Infinity);
  return {x:c.x + dx*t, y:c.y + dy*t};
}
function draw(){
  const map = document.getElementById("map"), svg = document.getElementById("wires");
  const m = map.getBoundingClientRect();
  const el = id => map.querySelector(`[data-id="${CSS.escape(id)}"]`);
  const active = hot || selected;
  const maxW = Math.max(1, ...sheetEdges.map(e=>e.w));
  let out = "";
  sheetEdges.forEach(e=>{
    const A = el(e.a), B = el(e.b); if(!A || !B) return;
    const a = center(A.getBoundingClientRect(), m), b = center(B.getBoundingClientRect(), m);
    const isHot = active && (e.a===active || e.b===active || e.items.has(active));
    const col = isHot ? color(N[active].cat) : "";
    const sw = 1.2 + 2.6*(e.w-1)/Math.max(1,maxW-1);
    let p1, p2, d;
    if(e.port){
      p1 = {x:a.x + a.hw, y:a.y}; p2 = {x:b.x - b.hw, y:b.y};
      if(p2.x < p1.x){ p1 = {x:a.x, y:a.y + a.hh}; p2 = {x:b.x, y:b.y - b.hh}; d = `M${p1.x},${p1.y} C${p1.x},${(p1.y+p2.y)/2} ${p2.x},${(p1.y+p2.y)/2} ${p2.x},${p2.y}`; }
      else d = `M${p1.x},${p1.y} C${(p1.x+p2.x)/2},${p1.y} ${(p1.x+p2.x)/2},${p2.y} ${p2.x},${p2.y}`;
    } else {
      const dx = b.x-a.x, dy = b.y-a.y;
      p1 = edgePoint(a, dx, dy); p2 = edgePoint(b, -dx, -dy);
      const len = Math.hypot(p2.x-p1.x, p2.y-p1.y) || 1, bend = Math.min(46, len*.18);
      const cx = (p1.x+p2.x)/2 - (p2.y-p1.y)/len*bend, cy = (p1.y+p2.y)/2 + (p2.x-p1.x)/len*bend;
      d = `M${p1.x},${p1.y} Q${cx},${cy} ${p2.x},${p2.y}`;
    }
    const st = col ? ` style="stroke:${col}"` : "";
    const fl = col ? ` style="fill:${col}"` : ` style="fill:var(--ink-soft)"`;
    out += `<path class="wire ${isHot?"hot":""}" d="${d}" stroke-width="${sw.toFixed(2)}" ${e.port?'stroke-dasharray="4 4"':""}${st}/>`;
    out += `<circle class="wire wire-end ${isHot?"hot":""}" cx="${p1.x}" cy="${p1.y}" r="3"${fl}/><circle class="wire wire-end ${isHot?"hot":""}" cx="${p2.x}" cy="${p2.y}" r="3"${fl}/>`;
    if(e.w>1 && !e.port){
      const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
      out += `<text class="wlabel ${isHot?"hot":""}" x="${mx}" y="${my+4}" text-anchor="middle">${e.w}</text>`;
    }
  });
  svg.setAttribute("class", "wires" + (active ? " focus" : ""));
  svg.innerHTML = out;

  map.querySelectorAll(".tile,.port").forEach(t=>{
    const id = t.dataset.id;
    t.classList.toggle("hot", id===hot);
    const linked = active && sheetEdges.some(e=>(e.a===active&&e.b===id)||(e.b===active&&e.a===id)||(e.items.has(active)&&(e.a===id||e.b===id)&&id!==active));
    t.classList.toggle("linked", !!linked);
  });
}

/* ---------- events ---------- */
function wire(){
  document.querySelectorAll("[data-go],[data-sel]").forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.sel){ const f = b.dataset.go!==undefined ? (b.dataset.go||null) : N[b.dataset.sel].parent;
        if(f===focus && selected===b.dataset.sel){ selected=null; render(false); history.replaceState(null,"","#"+(focus||"map")); return; }
        if(f===focus){ selected=b.dataset.sel; try{history.replaceState(null,"","#"+selected);}catch(e){} render(false); return; }
        return go(f, b.dataset.sel); }
      go(b.dataset.go || null);
    };
  });
  document.querySelectorAll("#map [data-id]").forEach(t=>{
    const on = ()=>{ hot = t.dataset.id; draw(); }, off = ()=>{ hot = null; draw(); };
    t.onmouseenter = on; t.onfocus = on; t.onmouseleave = off; t.onblur = off;
  });
}
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if(selected){ selected=null; render(false); } else if(focus){ go(N[focus].parent); } }
});
new ResizeObserver(()=>draw()).observe(document.getElementById("map"));
document.getElementById("tiles").addEventListener("animationend", draw);
if(document.fonts) document.fonts.ready.then(draw);

/* deep link: #money, #value, #far … */
(function start(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(N[h]){ N[h].kids ? go(h, null, false) : go(N[h].parent, h, false); }
  else go(null, null, false);
})();
</script>
